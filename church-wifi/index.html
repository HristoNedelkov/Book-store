<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Връзка · Connection</title>
  <meta name="description" content="Единствената връзка, от която се нуждаеш, е Бог. The only connection you need is God.">
  <meta name="theme-color" content="#1c1a17">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 120 120" aria-hidden="true">
      <!-- Wi-Fi waves -->
      <path class="wave w3" d="M14 58a66 66 0 0 1 92 0"/>
      <path class="wave w2" d="M30 74a43 43 0 0 1 60 0"/>
      <path class="wave w1" d="M46 90a20 20 0 0 1 28 0"/>
      <!-- Cross instead of the dot -->
      <path class="cross" d="M60 92v26M51 101h18"/>
    </svg>

    <p class="status">Свързано · Connected</p>

    <h1 lang="bg">Единствената връзка, от която се нуждаеш, е&nbsp;Бог.</h1>
    <div class="divider" aria-hidden="true"><span>✝</span></div>
    <p class="en" lang="en">The only connection you need is&nbsp;God.</p>
  </main>
</body>
</html>
